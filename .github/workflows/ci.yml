name: CI

on:
  push:
    branches: [ai-engineer-upgrade, main]
  pull_request:
    branches: [ai-engineer-upgrade, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q api core tests scripts evals proofs

      - name: Secret scan
        run: bash scripts/ci_secret_scan.sh

      - name: Run pytest suite
        # No GEMINI_API_KEY is set here on purpose: the suite is
        # credential-free (scripted LLM, monkeypatched DB), and one test
        # asserts POST /audit returns an honest 503 without a key.
        run: python -m pytest tests/ -q
